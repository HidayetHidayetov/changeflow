name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: changeflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: changeflow/package-lock.json
      - run: npm ci
      - run: npm test

  build:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: changeflow/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend deps
        run: npm ci
        working-directory: changeflow
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: changeflow
          tagName: ${{ github.ref_name }}
          releaseName: 'ChangeFlow ${{ github.ref_name }}'
          releaseDraft: false
          args: --bundles nsis
